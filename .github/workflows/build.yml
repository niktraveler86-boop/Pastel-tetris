name: Build Tetris (Windows EXE)

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install mingw-w64
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64

      - name: Build tetris.exe (x86_64)
        run: |
          x86_64-w64-mingw32-g++ -std=c++17 -O2 -Wall -o tetris.exe tetris.cpp -lwinmm

      - name: List build output
        run: ls -la

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tetris-exe
          path: tetris.exe
